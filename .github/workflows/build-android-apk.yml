name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/build-android-apk.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_API_URL: https://nightguide-modern.vercel.app
      EXPO_PUBLIC_GOOGLE_AUTH_ENABLED: "true"
      EXPO_PUBLIC_SUPABASE_URL: https://ujlotgbvopjrjwpwgdxm.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_8WqYSW63uDSq4xTAyZjJJg_Ywh6hQ_7

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: apps/mobile/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/mobile

      - name: Generate Android project
        run: pnpm exec expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile

      - name: Make Gradle executable
        run: chmod +x gradlew
        working-directory: apps/mobile/android

      - name: Build standalone APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NightGuide-Android-APK
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

